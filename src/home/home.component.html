<div class="channel-name">
    <app-topbar></app-topbar>
    <span
        class="name"
        (mouseenter)="onChannelNameHover()"
        (mouseleave)="onChannelNameLeave()"
        (click)="onChooseChannel()"
        >{{ currentChannel }}'s chat </span
    >

   <button *ngIf="username == currentChannel" class="chatter-list" (click)="onChatterList()"> <img src="persons.svg"></button>

    <div class="dropdown">
        <button class="vertical-menu" (click)="onVerticalMenu()">
            <img src="vertical.svg" />
        </button>
    </div>

</div>

@if (showVerticalMenuOptions) {
    <div class="dropdown-content">
        <button (click)="onChooseChannel()">Switch Channel</button>
        <button (click)="onOpenStreamInBrowser()">
            Open Stream In Browser
        </button>
        <button *ngIf="currentChannel === username" (click)="onOpenModView()">
            Open Mod View 
        </button>
        <button (click)="onClearChat()">Clear Chat</button>
        @if (isConnected) {
          <button (click)="onDisconnect()">Disconnect</button>
        }@else {
          <button (click)="loadChatMessages(currentChannel)">Connect</button>
          }
    </div>
}

@if (channelNameHover ) {
    <div class="stream-info">
        <img *ngIf="streamInfoToShow" [src]="streamInfoToShow.thumbnail" >
        <span>{{ streamInfoToShow.title }}</span>
        <span *ngIf="streamInfoToShow.viewer_count">Viewer: {{ streamInfoToShow.viewer_count }}</span>
   </div>
}

<br />
<div class="chat-container" (click)="onDisableVerticalMenu()" #chat>
    @for (msg of messages; track $index) {
          <app-chat [emojis]="globalEmojiNames" [badges]="chatterInfo" [emojisChannel]="channelEmojis" [message]="msg"  [color]="chatterInfo.color"></app-chat>
    }
</div>

<div class="chat-entry">
    <textarea
        #chatEntry
        spellcheck="false"
        [placeholder]="placeholderString"
        [(ngModel)]="userChatMessage"
        (keydown)="onSendMessage($event)"
    ></textarea>
    <button (click)="onEmojiPicker()" class="emoji"><img width="20" height="20" src="emoji.svg"></button>

</div>
