<div class="container">
    <h1 style="display:flex;justify-content: center">Account</h1>

    @if (username) {
        <div class="user-card">
            <div class="top">
                <img [src]="account_profile_picture" width="100" height="100" />
                <div class="items">
                    <strong>
                        <span>{{ username }}</span>
                    </strong>
                    <div class="desc">
                        <p>
                            {{ account_description }}
                        </p>
                    </div>
                    <div class="extra-info">
                        <span>Created at: {{ account_created_at }}</span>
                    </div>
                </div>
            </div>
        </div>
    } @else {
        <div class="logout-text">
            <strong>You are not logged in!</strong>
            <button title="Login" (click)="onLogin()">Login</button>
        </div>
    }
</div>
