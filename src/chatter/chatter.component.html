<div class="container">
								<input [(ngModel)]="searchValue" (change)="search()" placeholder="Search...">
								<span style="color: grey">Searching: {{ searchValue }} </span>
								@for (x of data; track $index) {
																@if (searchValue == x["user_name"] || searchValue == "") {
																<span class="user">{{ x["user_name"]}}</span>

																}
								}
</div>
